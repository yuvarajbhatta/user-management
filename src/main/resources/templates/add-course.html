<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Add New Course</h2>
    <form th:action="@{/add-course}" th:object="${course}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Instructor</label>
            <input type="text" th:field="*{instructor}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Course</button>
    </form>
    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">← Back to Dashboard</a>
</div>
</body>
</html>
