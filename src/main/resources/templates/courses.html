<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Courses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">Courses</h2>

  <table class="table table-bordered">
    <thead class="table-light">
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}">
      <td th:text="${course.id}"></td>
      <td th:text="${course.title}"></td>
      <td th:text="${course.description}"></td>
      <td>
        <!-- Edit -->
        <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="btn btn-sm btn-warning">Edit</a>

        <!-- Delete -->
        <form th:action="@{/courses/delete/{id}(id=${course.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
        </form>

        <!-- Enroll -->
        <form th:action="@{/enroll/{courseId}(courseId=${course.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-success">Enroll</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <a href="/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
