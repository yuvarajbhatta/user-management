<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dashboard-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .dashboard-card {
            width: 200px;
            height: 120px;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dashboard-card:hover {
            transform: scale(1.05);
            background-color: #e9ecef;
        }
        .dashboard-card a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 600;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">Course Management</span>
        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2>Hello, <span th:text="${user.username}"></span>!</h2>
    <p class="lead">Role: <span th:text="${user.role}"></span></p>

    <div class="dashboard-menu">
        <div class="dashboard-card"><a th:href="@{/courses}">📚 View Courses</a></div>
        <div class="dashboard-card"><a th:href="@{/enrollments}">📝 My Enrollments</a></div>
        <div class="dashboard-card"><a th:href="@{/add-course}">➕ Add New Course</a></div>
        <div class="dashboard-card"><a th:href="@{/users}">👥 All Users</a></div>
    </div>

</div>
</body>
</html>
