<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>All Users</title></head>
<body>
<h1>User List</h1>
<a href="/add">Add New User</a>
<ul>
    <li th:each="user : ${users}">
        <span th:text="${user.name}"></span> -
        <span th:text="${user.email}"></span>
    </li>
</ul>
</body>
</html>
